server.port=8081

# Utilisez localhost pour le nom d'hôte MySQL (car ils sont dans le même réseau Docker)
spring.datasource.url=jdbc:mysql://mysql:3306/soa_users?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuration JWT avec valeurs par défaut
jwt.secret=${JWT_SECRET:mySecretKey1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}